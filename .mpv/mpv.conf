# tdl=no
# tdl-raw-options=proxy=http://z:3128
# tdl-format=18

vo=gpu-next
gpu-api=vulkan

ontop=no
speed=1.46
hwdec=auto
pause

profile=fast
display-fps-override=30
framedrop=decoder+vo

watch-later-options-append=hwdec
watch-later-options-append=window-scale
save-position-on-quit
use-filedir-conf
geometry=-16+16
window-scale=1

# ao=jack
volume=70
# audio-channels=2
alang=en,eng

cache=yes
cache-on-disk=no
demuxer-max-bytes=256M
demuxer-max-back-bytes=768M
cache-pause=no

# osd-align-y=bottom
# osd-align-x=right
osd-duration=2115
osd-margin-x=8
osd-margin-y=8
osd-level=3
osd-font-size=21
osd-fractions=no
# osd-color='#706e6e'
# osd-font='URW Gothic'
osd-font='Liberation Sans Narrow'
osd-bar-h=3.215
osd-bar-w=61
osd-on-seek=msg-bar
osd-playing-msg='Playing: ${filename}'
osd-msg3='${osd-sym-cc} ${time-pos}/${duration}  [${?loop-file==inf:oo}${?loop-file==no:1}]  x${speed}  [${percent-pos}%]  ${frame-drop-count}  ${cache-speed}   [${file-size:}]'

term-osd=force
term-osd-bar=no
term-osd-bar-chars=[Q|-]
term-status-msg="${?pause==yes: ⏳}${?pause==no: 📀} ${playback-time} x${speed} | 🔈 ${volume}% | C${contrast} S${saturation} B${brightness} G${gamma} | 🔎 ${video-zoom} | 🎬 ${video-format}/${audio-codec-name} ${width}x${height} | ⚡️ ${cache-speed} [${playlist-pos-1}/${playlist/count}]  ${?file-size:}"

sub=no
sub-scale=1
sub-font-size=51
sub-pos=95
sub-blur=1
sub-color=1.0/1.0/0.0/0.75
sub-font=Fira Code
sub-codepage=utf-8
slang=en,eng,sp,esp

[profile1]

